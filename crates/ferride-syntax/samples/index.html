<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Word Counter</title>
  <style>
    .app { max-width: 40rem; margin: 0 auto; }
    #count:hover { color: #0078d4; }
  </style>
</head>
<body>
  <!-- Paste some text and press Count. -->
  <main class="app">
    <h1>Word Counter</h1>
    <textarea id="input" rows="8" placeholder="Paste text here"></textarea>
    <button type="button" id="count" disabled>Count &amp; sort</button>
    <ol id="results"></ol>
  </main>
  <script>
    const button = document.getElementById("count");
    button.addEventListener("click", () => console.log(42));
  </script>
</body>
</html>
