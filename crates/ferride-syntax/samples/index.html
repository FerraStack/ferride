<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Paste some text and press Count. -->
  <main class="app">
    <h1>Word Counter</h1>
    <textarea id="input" rows="8" placeholder="Paste text here"></textarea>
    <button type="button" id="count" disabled>Count &amp; sort</button>
    <ol id="results"></ol>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
