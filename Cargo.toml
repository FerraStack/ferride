[workspace]
resolver = "3"
members = [
    "crates/ferride-buffer",
    "crates/ferride-syntax",
    "crates/ferride-lsp",
    "crates/ferride-workspace",
    "crates/ferride-host",
    "crates/ferride-ffi",
    "crates/ferride-scm",
    "crates/ferride-theme",
    "crates/ferride-markdown",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/FerraStack/ferride"
authors = ["FerraStack contributors"]

[workspace.dependencies]
ferride-buffer = { path = "crates/ferride-buffer" }
ferride-syntax = { path = "crates/ferride-syntax" }
ferride-lsp = { path = "crates/ferride-lsp" }
ferride-workspace = { path = "crates/ferride-workspace" }
ferride-host = { path = "crates/ferride-host" }
ferride-markdown = { path = "crates/ferride-markdown" }
ferride-scm = { path = "crates/ferride-scm" }
ferride-theme = { path = "crates/ferride-theme" }

ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-bash = "0.25.1"
tree-sitter-sequel = "0.3.11"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
uniffi = "0.32.2"
thiserror = "2.0.21"
pulldown-cmark = { version = "0.13.0", default-features = false }
unicode-segmentation = "1.12.0"
log = "0.4.35"
tempfile = "3.27.0"
gix = { version = "0.90.0", default-features = false, features = ["sha1", "basic", "status", "worktree-mutation", "dirwalk", "credentials", "blocking-http-transport-reqwest", "progress-tree", "parallel"] }
gix-pack = { version = "0.77.0", default-features = false, features = ["generate"] }
# TLS for gix's reqwest transport: rustls with the `ring` provider (builds with the NDK without cmake/aws-lc).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Shipped in the APK: tuned for size and speed (the grammars' C parse tables
# dominate; -Os on them saves ~1%, so they stay at opt-level 3). `strip =
# "symbols"` drops .symtab, which UniFFI's library-mode bindgen reads, so the
# Kotlin bindings are generated from the unstripped host build instead.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
