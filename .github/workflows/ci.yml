name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust · fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  android:
    name: Android · APK + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Select NDK (r28+ links 16 KB-aligned ELFs)
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Rust core, unit + screenshot tests, debug APK
        working-directory: android
        run: ./gradlew --max-workers=4 testDebugUnitTest -Proborazzi.test.record=true assembleDebug
      - name: Check 16 KB alignment
        run: |
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk | tail -n 3
      - uses: actions/upload-artifact@v7
        with:
          name: ferride-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-roborazzi
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  emulator:
    name: Emulator · smoke test + screenshots
    needs: android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ferride-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-screenshots.sh apk/app-debug.apk screenshots-emulator
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-emulator
          path: screenshots-emulator/
          if-no-files-found: warn

  screenshots-comment:
    name: Post screenshots to the PR
    needs: [android, emulator]
    if: always() && github.event_name == 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true
      - name: Publish to ci-screenshots and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/post-screenshots.sh shots
